name: CI - Testes da Entrega Intermediária

on:
  push:
    branches: [main, entrega-intermediaria]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar teste automatizado
        run: node --test tests/integration.test.js
